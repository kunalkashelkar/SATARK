version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sat-sa-postgres
    environment:
      - POSTGRES_DB=sat_sa
      - POSTGRES_USER=sat_sa
      - POSTGRES_PASSWORD=sat_sa_enclave_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sat_sa -d sat_sa"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: sat-sa-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=sat_sa
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sat-sa-backend
    ports:
      - "8001:8001"
    environment:
      - APP_NAME=SAT-SA
      - APP_ENV=production
      - APP_VERSION=OPS-v4.8
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - DATABASE_URL=postgresql+psycopg://sat_sa:sat_sa_enclave_secret@postgres:5432/sat_sa
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - DB_SQLITE_FALLBACK_ON_ERROR=false
      - SECRET_KEY=sat-sa-enclave-secret-key-change-in-production
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sat-sa-frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
