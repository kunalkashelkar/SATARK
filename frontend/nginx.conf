# SAT-SA Nginx Reverse Proxy Configuration
# Single Deployment Host: Serves React SPA & Proxies /api to FastAPI backend
server {
    listen 80;
    server_name _;

    # Client body size for evidence uploads (Parquet / JSON / telemetry)
    client_max_body_size 64M;

    # Security Headers (Section 17 & 45)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Backend API Reverse Proxy (/api/v1 -> backend:8001/api/v1)
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Root Health Check Proxy (allows curl http://<host>/health)
    location = /health {
        proxy_pass http://backend:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root Ready Check Proxy (allows curl http://<host>/ready)
    location = /ready {
        proxy_pass http://backend:8001/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend Static Assets & SPA Routing fallback (Section 15 & 16)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache Control for static assets (hashed JS, CSS, images)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
